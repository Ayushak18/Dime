services:
  postgres:
    image: postgres:16
    container_name: dime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - dime_postgres_data:/var/lib/postgresql/data

volumes:
  dime_postgres_data:
